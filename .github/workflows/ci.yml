name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    uses: okamyuji/reusable-workflows/.github/workflows/flutter-ci.yml@v1
    with:
      # pubspec.lock was resolved with this Flutter; a newer SDK can change its pinned packages and fail --enforce-lockfile
      flutter-version: "3.47.9"

  server:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      working-directory: server

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
